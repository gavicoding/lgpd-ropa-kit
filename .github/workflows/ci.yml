name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: CLI smoke test
        run: |
          ropa-kit init /tmp/inv
          ropa-kit report /tmp/inv -o /tmp/inv.html || test $? -eq 1
          ropa-kit ripd /tmp/inv rh-atestados-medicos -o /tmp/ripd.md
          set +e
          ropa-kit validate /tmp/inv
          test $? -eq 1
